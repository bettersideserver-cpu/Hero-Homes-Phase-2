<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hero Homes</title>
    <link rel="stylesheet" href="wbn05d6fbh.css">
    <link rel="stylesheet" href="JS/TowerpinCSS.css">
    <link rel="stylesheet" href="JS/Notification/UI_Hint-CSS.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════
           DESIGN TOKENS — Unified Premium System
           ═══════════════════════════════════════════════ */
        :root {
            --bg-0: #C9C3B7;
            --bg-tint: #B8B0A0;

            --surface-1: #F4EDDD;
            --surface-2: #FBF7EC;
            --surface-3: #FBF7EC;

            --ink: #0A2B21;
            --ink-soft: rgba(10, 43, 33, 0.72);
            --ink-mid: rgba(10, 43, 33, 0.58);
            --ink-dim: rgba(10, 43, 33, 0.40);
            --ink-faint: rgba(10, 43, 33, 0.24);
            --ink-trace: rgba(10, 43, 33, 0.09);

            --line: rgba(10, 43, 33, 0.09);
            --line-hi: rgba(10, 43, 33, 0.15);

            --gold: #0F3D2E;
            --gold-light: #1C5A44;
            --gold-dark: #04120D;
            --gold-soft: rgba(15, 61, 46, 0.06);
            --gold-tint: rgba(15, 61, 46, 0.12);

            --on-accent: #FBF7EC;
            --brass: #C39E59;

            --glass: #FBF7EC;
            --glass-border: rgba(10, 43, 33, 0.14);
            --glass-border-hover: rgba(15, 61, 46, 0.38);

            --hair: rgba(10, 43, 33, 0.14);
            --hair-soft: rgba(10, 43, 33, 0.08);

            --text: #0A2B21;
            --text-muted: rgba(10, 43, 33, 0.55);

            --shadow-sm: 0 1px 2px rgba(10, 43, 33, 0.06);
            --shadow-md: 0 4px 16px rgba(10, 43, 33, 0.10);
            --shadow-lg: 0 12px 40px rgba(10, 43, 33, 0.16);

            --font-display: 'Cormorant Garamond', serif;
            --font-ui: 'Outfit', sans-serif;
            --ease-out: cubic-bezier(0.22, 0.68, 0, 1.04);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --blur: none;

            --r: 10px;
            --r-lg: 16px;
            --r-pill: 999px;
            --bar: 56px;
            --foot: 48px;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ═══════════════════════════════════════════════
           ORIGINAL STYLES (preserved)
           ═══════════════════════════════════════════════ */
        .mdb {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pdf-icon {
            width: 50px;
            height: auto;
            object-fit: contain;
        }

        .fallback-text {
            margin-left: 6px;
            font-weight: 600;
            color: var(--ink);
        }

        .info-card {
            top: -100px;
            left: -50px;
            position: fixed;
            background-color: transparent;
            z-index: 8999;
            pointer-events: none;
            transform: scale(.9);
        }

        @media (max-width: 600px) {
            .Front {
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) scale(1.8);
            }

            .info-card,
            .info-content {
                transform: scale(0.7);
                top: -50px;
                left: -30px;
            }
        }

        body.splash-active {
            overflow: hidden;
            touch-action: none;
        }

        body.splash-active #music-toggle {
            touch-action: manipulation !important;
            pointer-events: auto !important;
        }

        body {
            background: var(--bg-0);
            color: var(--ink);
        }

        /* ═══════════════════════════════════════════════
           SPLASH — Elevated
           ═══════════════════════════════════════════════ */
        .splash {
            position: fixed;
            inset: 0;
            z-index: 12000;
            display: grid;
            place-items: center;
            pointer-events: auto;
            opacity: 1;
            transition: opacity .7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .splash__backdrop {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(244, 237, 221, 0.92), rgba(228, 217, 192, 0.98));
        }

        .splash__content {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            transform: translateY(8px);
            animation: splash-pop .6s cubic-bezier(0.22, 0.68, 0, 1.04) forwards;
            pointer-events: none;
        }

        .splash__text {
            font: 500 16px/1.2 var(--font-ui);
            color: var(--ink-soft);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(10, 42, 32, 0.175);
        }

        .splash__text strong {
            color: var(--gold);
            font-weight: 600;
        }

        @keyframes splash-pop {
            from {
                opacity: 0;
                transform: translateY(20px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .splash.is-hidden {
            opacity: 0;
        }

        /* ═══════════════════════════════════════════════
           LEFT PANEL — Residences
           ═══════════════════════════════════════════════ */
        .left-panel {
            position: fixed;
            top: 50%;
            left: 24px;
            transform: translateY(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 248px;
            opacity: 0;
            animation: slide-in-left 0.9s var(--ease-out) 0.6s forwards;
        }

        @keyframes slide-in-left {
            from {
                opacity: 0;
                transform: translateY(-50%) translateX(-24px);
            }

            to {
                opacity: 1;
                transform: translateY(-50%) translateX(0);
            }
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 6px 12px;
            border-bottom: 1px solid rgba(15, 61, 46, 0.18);
            margin-bottom: 4px;
        }

        .panel-header::before {
            content: '';
            width: 22px;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            flex-shrink: 0;
        }

        .panel-label {
            font-family: var(--font-ui);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            text-shadow: 0 1px 6px rgba(10, 42, 32, 0.21);
        }

        .property-type {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            background: var(--surface-2);
            border: 1px solid rgba(15, 61, 46, 0.2);
            border-radius: var(--r-lg);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.4s var(--ease-out);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(10, 42, 32, 0.14), 0 0 0 0 rgba(15, 61, 46, 0);
        }

        .property-type::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, var(--gold-light), var(--gold), var(--gold-dark));
            transform: scaleY(0);
            transition: transform 0.45s var(--ease-out);
            transform-origin: center;
            border-radius: 0 var(--r) var(--r) 0;
        }

        .property-type::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(15, 61, 46, 0.08) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .property-type:hover {
            border-color: rgba(15, 61, 46, 0.4);
            transform: translateX(6px);
            box-shadow: 0 8px 32px rgba(10, 42, 32, 0.175), 0 0 40px rgba(15, 61, 46, 0.1);
            background: var(--surface-2);
        }

        .property-type:hover::before {
            transform: scaleY(1);
        }

        .property-type:hover::after {
            opacity: 1;
        }

        /* Shimmer edge effect on hover */
        .property-type .pt-shimmer {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(15, 61, 46, 0.06), transparent);
            transition: left 0.6s ease;
            pointer-events: none;
        }

        .property-type:hover .pt-shimmer {
            left: 100%;
        }

        .pt-icon {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: var(--r-lg);
            background: linear-gradient(145deg, rgba(15, 61, 46, 0.16), rgba(15, 61, 46, 0.04));
            border: 1px solid rgba(15, 61, 46, 0.2);
            display: grid;
            place-items: center;
            transition: all 0.4s var(--ease-out);
            position: relative;
        }

        /* Subtle pulse ring on icon */
        .pt-icon::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: var(--r-lg);
            border: 1px solid rgba(15, 61, 46, 0);
            transition: all 0.4s ease;
        }

        .property-type:hover .pt-icon {
            background: linear-gradient(145deg, rgba(15, 61, 46, 0.32), rgba(15, 61, 46, 0.1));
            border-color: rgba(15, 61, 46, 0.55);
            box-shadow: 0 0 20px rgba(15, 61, 46, 0.15), inset 0 1px 0 rgba(10, 42, 32, 0.08);
        }

        .property-type:hover .pt-icon::after {
            border-color: rgba(15, 61, 46, 0.15);
        }

        .pt-icon svg {
            width: 22px;
            height: 22px;
            stroke: var(--gold);
            transition: all 0.4s var(--ease-out);
            filter: drop-shadow(0 1px 3px rgba(15, 61, 46, 0.2));
        }

        .property-type:hover .pt-icon svg {
            transform: scale(1.1);
            filter: drop-shadow(0 2px 6px rgba(15, 61, 46, 0.3));
        }

        .pt-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .pt-name {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: 0.3px;
            line-height: 1.15;
            text-shadow: 0 1px 4px rgba(10, 42, 32, 0.175);
        }

        .pt-sub {
            font-family: var(--font-ui);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--ink-mid);
            transition: all 0.3s ease;
            text-shadow: 0 1px 3px rgba(10, 42, 32, 0.14);
        }

        .property-type:hover .pt-name {
            color: var(--ink);
        }

        .property-type:hover .pt-sub {
            color: var(--gold-light);
            letter-spacing: 2.2px;
        }

        /* Arrow indicator on hover */
        .pt-arrow {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%) translateX(-6px);
            opacity: 0;
            transition: all 0.35s var(--ease-out);
        }

        .pt-arrow svg {
            width: 16px;
            height: 16px;
            stroke: var(--gold);
            stroke-width: 2;
        }

        .property-type:hover .pt-arrow {
            opacity: 0.7;
            transform: translateY(-50%) translateX(0);
        }

        /* ═══════════════════════════════════════════════
           RIGHT TOP CONTROLS — Gallery / Walkthrough / Menu
           ═══════════════════════════════════════════════ */
        .top-controls {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            animation: slide-in-right 0.9s var(--ease-out) 0.6s forwards;
        }

        @keyframes slide-in-right {
            from {
                opacity: 0;
                transform: translateX(24px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .control-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px 20px;
            background: var(--surface-2);
            border: 1px solid rgba(15, 61, 46, 0.18);
            border-radius: var(--r-lg);
            color: var(--ink-soft);
            font-family: var(--font-ui);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.35s var(--ease-out);
            box-shadow: 0 4px 16px rgba(10, 42, 32, 0.122);
            position: relative;
            overflow: hidden;
        }

        .control-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(15, 61, 46, 0.1), transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .control-btn svg {
            width: 16px;
            height: 16px;
            stroke: var(--gold);
            transition: transform 0.35s var(--ease-spring);
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 1px 3px rgba(15, 61, 46, 0.2));
        }

        .control-btn span {
            position: relative;
            z-index: 1;
            text-shadow: 0 1px 4px rgba(10, 42, 32, 0.14);
        }

        .control-btn:hover {
            border-color: rgba(15, 61, 46, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(10, 42, 32, 0.158), 0 0 30px rgba(15, 61, 46, 0.1);
            color: var(--ink);
            background: var(--surface-2);
        }

        .control-btn:hover::after {
            opacity: 1;
        }

        .control-btn:hover svg {
            transform: scale(1.15);
        }

        /* Hamburger button */
        .menu-btn {
            width: 42px;
            height: 42px;
            padding: 0;
            display: grid;
            place-items: center;
            background: var(--surface-2);
            border: 1px solid rgba(15, 61, 46, 0.18);
            border-radius: var(--r-lg);
            cursor: pointer;
            transition: all 0.35s var(--ease-out);
            box-shadow: 0 4px 16px rgba(10, 42, 32, 0.122);
        }

        .menu-btn:hover {
            border-color: rgba(15, 61, 46, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(10, 42, 32, 0.158), 0 0 30px rgba(15, 61, 46, 0.1);
            background: var(--surface-2);
        }

        .menu-btn-lines {
            width: 18px;
            height: 13px;
            position: relative;
        }

        .menu-btn-lines span {
            position: absolute;
            left: 0;
            width: 100%;
            height: 1.5px;
            background: var(--gold);
            border-radius: var(--r);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .menu-btn-lines span:nth-child(1) {
            top: 0;
        }

        .menu-btn-lines span:nth-child(2) {
            top: 50%;
            transform: translateY(-50%);
            width: 65%;
        }

        .menu-btn-lines span:nth-child(3) {
            bottom: 0;
        }

        .menu-btn.is-open .menu-btn-lines span:nth-child(1) {
            top: 50%;
            transform: translateY(-50%) rotate(45deg);
        }

        .menu-btn.is-open .menu-btn-lines span:nth-child(2) {
            opacity: 0;
            transform: translateX(-16px);
        }

        .menu-btn.is-open .menu-btn-lines span:nth-child(3) {
            bottom: 50%;
            transform: translateY(50%) rotate(-45deg);
        }

        /* ═══════════════════════════════════════════════
           DROPDOWN MENU — Refined
           ═══════════════════════════════════════════════ */
        .dropdown-menu {
            position: fixed;
            top: 80px;
            right: 24px;
            z-index: 10001;
            width: 270px;
            background: var(--surface-3);
            border: 1px solid rgba(15, 61, 46, 0.18);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-lg), 0 0 60px rgba(15, 61, 46, 0.06);
            padding: 6px;
            opacity: 0;
            transform: translateY(-12px) scale(0.95);
            pointer-events: none;
            transition: all 0.35s var(--ease-out);
        }

        .dropdown-menu.is-open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .dropdown-menu::before {
            content: '';
            position: absolute;
            top: -6px;
            right: 16px;
            width: 12px;
            height: 12px;
            background: var(--surface-3);
            border-top: 1px solid var(--glass-border);
            border-left: 1px solid var(--glass-border);
            transform: rotate(45deg);
        }

        .dropdown-header {
            padding: 14px 16px 12px;
            border-bottom: 1px solid rgba(15, 61, 46, 0.08);
            margin-bottom: 4px;
        }

        .dropdown-header-label {
            font-family: var(--font-ui);
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--gold);
            opacity: 0.8;
        }

        .dropdown-header-title {
            font-family: var(--font-display);
            font-size: 19px;
            font-weight: 600;
            color: var(--ink);
            margin-top: 3px;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            border-radius: var(--r);
            text-decoration: none;
            color: var(--ink);
            font-family: var(--font-ui);
            font-size: 14px;
            font-weight: 400;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .dropdown-item:hover {
            background: rgba(15, 61, 46, 0.08);
            color: var(--ink);
        }

        .dropdown-item-icon {
            width: 34px;
            height: 34px;
            border-radius: var(--r);
            background: linear-gradient(145deg, rgba(15, 61, 46, 0.1), rgba(15, 61, 46, 0.02));
            border: 1px solid rgba(15, 61, 46, 0.12);
            display: grid;
            place-items: center;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .dropdown-item:hover .dropdown-item-icon {
            background: linear-gradient(145deg, rgba(15, 61, 46, 0.22), rgba(15, 61, 46, 0.06));
            border-color: rgba(15, 61, 46, 0.4);
        }

        .dropdown-item-icon svg {
            width: 15px;
            height: 15px;
            stroke: var(--gold);
        }

        .dropdown-item-text {
            flex: 1;
        }

        .dropdown-item-title {
            display: block;
            font-size: 13.5px;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .dropdown-item-sub {
            display: block;
            font-size: 9.5px;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .dropdown-item:hover .dropdown-item-sub {
            color: var(--gold-light);
        }

        .dropdown-item-arrow {
            stroke: var(--text-muted);
            transition: all 0.3s ease;
            opacity: 0;
        }

        .dropdown-item:hover .dropdown-item-arrow {
            stroke: var(--gold);
            opacity: 1;
            transform: translateX(3px);
        }

        /* ═══════════════════════════════════════════════
           MOBILE — Left/Right Panel adjustments
           ═══════════════════════════════════════════════ */
        @media (max-width: 768px) {

            /* ── LEFT PANEL: horizontal row, floats above action row ── */
            .left-panel {
                top: auto;
                bottom: 160px;
                left: 12px;
                right: 12px;
                transform: none;
                width: auto;
                flex-direction: row;
                gap: 8px;
                animation: slide-in-bottom 0.8s var(--ease-out) 0.6s forwards;
            }

            @keyframes slide-in-bottom {
                from {
                    opacity: 0;
                    transform: translateY(24px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .panel-header {
                display: none;
            }

            .property-type {
                flex: 1;
                padding: 15px 12px;
                gap: 10px;
                background: var(--surface-2);
                border-radius: var(--r-lg);
                min-height: 68px;
                overflow: visible;
            }

            .property-type:hover {
                transform: none;
                background: var(--surface-3);
            }

            .property-type:active {
                transform: scale(0.97);
            }

            /* Bigger icons & text */
            .pt-icon {
                width: 44px;
                height: 44px;
                border-radius: var(--r-lg);
                flex-shrink: 0;
            }

            .pt-icon svg {
                width: 22px;
                height: 22px;
            }

            .pt-text {
                flex: 1;
                min-width: 0;
                overflow: hidden;
            }

            .pt-name {
                font-size: 16px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .pt-sub {
                font-size: 9.5px;
                letter-spacing: 1.4px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .pt-arrow {
                display: none;
            }

            /* ── TOP CONTROLS: bigger, label visible ── */
            .top-controls {
                top: 14px;
                right: 14px;
                gap: 8px;
            }

            .control-btn {
                padding: 10px 16px;
                width: auto;
                height: 46px;
                gap: 7px;
                border-radius: var(--r-lg);
                font-size: 10.5px;
                letter-spacing: 1.2px;
                justify-content: center;
            }

            /* Labels visible on mobile */
            .control-btn span {
                display: block;
            }

            .menu-btn {
                width: 46px;
                height: 46px;
                border-radius: var(--r-lg);
            }

            .dropdown-menu {
                top: 70px;
                right: 14px;
                width: calc(100vw - 28px);
                max-width: 320px;
            }
        }

        /* Very small phones — hide button labels */
        @media (max-width: 380px) {
            .control-btn span {
                display: none;
            }

            .control-btn {
                padding: 0;
                width: 46px;
            }
        }

        /* ═══════════════════════════════════════════════
           RERA / Enquiry / Forms (preserved + refined)
           ═══════════════════════════════════════════════ */
        .rera-blueprint {
            position: fixed;
            top: 26px;
            left: 30px;
            z-index: 1000;
            padding-left: 14px;
            border-left: 2px solid rgba(251, 247, 236, 0.35);
        }

        /* ═══════════════════════════════════════════════
           BOTTOM JUMPBAR — Premium Redesign
           ═══════════════════════════════════════════════ */
        .jumpbar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 11000;
            display: flex;
            align-items: center;
            gap: 0;
            padding: 5px;

            border: 1px solid rgba(15, 61, 46, 0.18);

                0 0 80px rgba(15, 61, 46, 0.06),
                inset 0 1px 0 rgba(10, 42, 32, 0.04);
            opacity: 0;
            animation: jumpbar-rise 0.9s var(--ease-out) 0.8s forwards;
        }

        @keyframes jumpbar-rise {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .jumpbar::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--r-pill);
            padding: 1px;
            background: linear-gradient(135deg,
                    rgba(15, 61, 46, 0.35),
                    transparent 35%,
                    transparent 65%,
                    rgba(15, 61, 46, 0.15));
            /* -webkit-mask: linear-gradient(#04120D 0 0) content-box, linear-gradient(#04120D 0 0); */
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .jumpbar-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            user-select: none;

            font-family: var(--font-ui);
            font-size: 7.5px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            line-height: 1;
            opacity: 0.8;
        }

        .jumpbar-brand-name {
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: 0.5px;
            line-height: 1.1;
            margin-top: 2px;
            text-shadow: 0 1px 3px rgba(10, 42, 32, 0.105);

            display: flex;
            align-items: center;
            gap: 7px;
            padding: 10px 18px;
            border-radius: var(--r-pill);
            text-decoration: none;
            color: var(--ink-mid);
            font-family: var(--font-ui);

            font-weight: 500;
            letter-spacing: 1.5px;

            position: relative;
            white-space: nowrap;
        }

        .jumpbar-item svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            transition: all 0.35s ease;
        }

        .jumpbar-item:hover {
            color: var(--gold-light);
            background: rgba(15, 61, 46, 0.07);
        }

        .jumpbar-item:hover svg {
            transform: scale(1.08);

        .jumpbar-item.is-active {
            color: var(--ink);
            background: linear-gradient(135deg, var(--gold-light), var(--gold));

        /* ═══════════════════════════════════════════════
           SUBTLE AMBIENT GLOW — Corner Accents
           ═══════════════════════════════════════════════ */
        body::before {
            content: '';
            position: fixed;
            top: -150px;
            left: -150px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(15, 61, 46, 0.05), transparent 65%);
            pointer-events: none;
            z-index: 9999;
            animation: ambient-pulse 6s ease-in-out infinite alternate;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -100px;
            right: -100px;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(15, 61, 46, 0.04), transparent 65%);
            pointer-events: none;
            z-index: 9999;
            animation: ambient-pulse 8s ease-in-out 2s infinite alternate;
        }

        @keyframes ambient-pulse {
            from {
                opacity: 0.6;
            }

            to {
                opacity: 1;
            }
        }

        /* Floating gold particles effect */
        .ambient-particles {
            position: fixed;
            inset: 0;
            z-index: 9998;
            pointer-events: none;
            overflow: hidden;
        }

        .ambient-particles .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0;
            animation: particle-float linear infinite;
        }

        @keyframes particle-float {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }

            10% {
                opacity: 0.4;
            }

            90% {
                opacity: 0.2;
            }

            100% {
                opacity: 0;
                transform: translateY(-10vh) scale(1);
            }
        }

    <style>
        /* ══════════════════════════════════════════════
           PORTRAIT / VERTICAL SCREEN — Main image layout
           Image is 3840×5830 (tall portrait).
           On a vertical phone we fill the screen height.
           ══════════════════════════════════════════════ */
        @media (max-width: 768px) and (orientation: portrait) {

            /* Root container: fixed, full viewport */
            .Front {
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                width: 100vw !important;
                height: 100dvh !important;
                /* dvh = dynamic viewport height (accounts for browser chrome) */
                transform: none !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                overflow: hidden !important;
            }

            /* Image wrapper: fills parent */
            .Front .image-wrapper {
                position: relative !important;
                width: 100% !important;
                height: 100% !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
            }

            /* Main building image: fill height, let width auto (slight side clip = correct) */
            .Front .image-wrapper img#mainImage,
            .Front .image-wrapper .blur-up {
                height: 100dvh !important;
                width: auto !important;
                max-width: none !important;
                object-fit: contain !important;
                display: block !important;
                flex-shrink: 0 !important;
            }

            /* Day/time overlay images: match mainImage exactly (JS also syncs via getBoundingClientRect) */
            .day-img-overlay {
                position: fixed !important;
            }

            /* SVG cutout layer: must match image exactly — it's inside image-wrapper so it inherits */
            .Front .Cutout {
                position: absolute !important;
                top: 50% !important;
                left: 50% !important;
                transform: translate(-50%, -50%) !important;
                height: 100dvh !important;
                width: auto !important;
                aspect-ratio: 3840 / 5830 !important;
            }

            .Front .Cutout svg {
                width: 100% !important;
                height: 100% !important;
                display: block !important;
            }

            .Front .Cutout svg path {
                pointer-events: all !important;
                fill: transparent !important;
            }
        }

        /* Fallback for browsers without dvh support */
        @supports not (height: 100dvh) {
            @media (max-width: 768px) and (orientation: portrait) {
                .Front {
                    height: 100vh !important;
                }

                .Front .image-wrapper img#mainImage,
                .Front .image-wrapper .blur-up {
                    height: 100vh !important;
                }
            }
        }

    <script>
        function dismissExplore() {
            localStorage.setItem('heroExploreDismissed', '1');
            var screen = document.getElementById('explore-screen');
            var audio = document.getElementById('explore-audio');
            screen.classList.add('is-leaving');

            // Music: play immediately on user gesture (browser allows it here)
            if (audio) {
                audio.volume = 0;
                var playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(function () {
                        // Fade in volume smoothly
                        var vol = 0;
                        var fadeIn = setInterval(function () {
                            vol = Math.min(vol + 0.025, 0.65);
                            audio.volume = vol;
                            if (vol >= 0.65) clearInterval(fadeIn);
                        }, 60);
                    }).catch(function (e) {
                        console.warn('Audio play blocked:', e);
                        // Try again after interaction
                        document.addEventListener('click', function retry() {
                            audio.play().catch(function () { });
                            document.removeEventListener('click', retry);
                        }, { once: true });
                    });
                }
            }
            screen.addEventListener('animationend', function () {
                screen.style.display = 'none';
                document.body.style.touchAction = '';
                document.body.classList.remove('splash-active');

                // Do not call runSplash() here

                var btn = document.getElementById('music-toggle');
                if (btn) {
                    btn.style.cssText += 'display:flex!important;pointer-events:auto!important;touch-action:manipulation!important;z-index:99999!important;position:fixed!important;';
                    btn.onclick = function (e) {
                        e.stopPropagation();
                        toggleMusic();
                    };
                }
            }, { once: true });
        }

        var _musicMuted = false;
        var _savedVol = 0.65;
        function toggleMusic() {
            var audio = document.getElementById('explore-audio');
            var iconOn = document.getElementById('music-icon-on');
            var iconOff = document.getElementById('music-icon-off');
            var label = document.getElementById('music-label');
            if (!audio) return;
            if (_musicMuted) {
                // UNMUTE — call play() synchronously inside gesture on iOS
                audio.muted = false;
                audio.volume = _savedVol;
                audio.play().catch(function () { });
                iconOn.style.display = '';
                iconOff.style.display = 'none';
                label.textContent = 'Mute';
                _musicMuted = false;
            } else {
                // MUTE — pause immediately (no setInterval: iOS blocks gesture-deferred audio)
                _savedVol = audio.volume > 0 ? audio.volume : 0.65;
                audio.pause();
                audio.muted = true;
                iconOn.style.display = 'none';
                iconOff.style.display = '';
                label.textContent = 'Unmute';
                _musicMuted = true;
            }
        }
    </script>

    <script>
        // Image / hotspot sync (preserved)
        (function () {
            const img = document.querySelector('.image-wrapper img');
            const layer = document.getElementById('hsLayer');
            if (!img || !layer) return;

            function doSync() {
                const r = img.getBoundingClientRect();
                layer.style.top = r.top + 'px';
                layer.style.left = r.left + 'px';
                layer.style.width = r.width + 'px';
                layer.style.height = r.height + 'px';
            }

            function syncAfterLayout() {
                requestAnimationFrame(() => requestAnimationFrame(doSync));
            }

            if (img.complete) syncAfterLayout();
            else img.addEventListener('load', syncAfterLayout, { once: true });
            window.addEventListener('load', syncAfterLayout, { once: true });
            window.addEventListener('resize', syncAfterLayout);
            window.addEventListener('orientationchange', () => {
                syncAfterLayout();
                setTimeout(syncAfterLayout, 250);
            });

            if ('ResizeObserver' in window) new ResizeObserver(syncAfterLayout).observe(img);
        })();
    </script>

    <script>
        // Hamburger Dropdown Menu
        (function () {
            const menuBtn = document.getElementById('menuBtn');
            const dropdown = document.getElementById('dropdownMenu');
            if (!menuBtn || !dropdown) return;

            function openMenu() {
                menuBtn.classList.add('is-open');
                dropdown.classList.add('is-open');
                menuBtn.setAttribute('aria-expanded', 'true');
                dropdown.setAttribute('aria-hidden', 'false');
            }

            function closeMenu() {
                menuBtn.classList.remove('is-open');
                dropdown.classList.remove('is-open');
                menuBtn.setAttribute('aria-expanded', 'false');
                dropdown.setAttribute('aria-hidden', 'true');
            }

            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                menuBtn.classList.contains('is-open') ? closeMenu() : openMenu();
            });

            document.addEventListener('click', (e) => {
                if (!dropdown.contains(e.target) && !menuBtn.contains(e.target)) closeMenu();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeMenu();
            });
        })();
    </script>

    <script>
        // Jumpbar Click Ripple & Active State
        (function () {
            const items = document.querySelectorAll('.jumpbar-item');
            items.forEach(item => {
                item.addEventListener('click', function (e) {
                    items.forEach(i => i.classList.remove('is-active'));
                    this.classList.add('is-active');

                    const ripple = document.createElement('span');
                    ripple.className = 'jumpbar-ripple';
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                    this.appendChild(ripple);
                    ripple.addEventListener('animationend', () => ripple.remove());
                });
            });
        })();
    </script>

    <!-- ═══ GALLERY + WALKTHROUGH SCRIPTS (ADDED) ═══ -->
    <script>
        // Gallery Lightbox
        (function () {
            const images = [
                'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1200&q=80',
                'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=1200&q=80',
                'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1200&q=80',
                'https://images.unsplash.com/photo-1613490493576-7fde63acd811?w=1200&q=80',
                'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=1200&q=80',
                'https://images.unsplash.com/photo-1600566753376-12c8ab7a5a1e?w=1200&q=80'
            ];
            let idx = 0;
            const overlay = document.getElementById('galleryOverlay');
            const img = document.getElementById('galleryImage');
            const counter = document.getElementById('galleryCurrent');
            const total = document.getElementById('galleryTotal');
            const thumbsWrap = document.getElementById('galleryThumbs');
            if (!overlay || !img) return;
            total.textContent = images.length;

            // Build thumbs
            images.forEach((src, i) => {
                const t = document.createElement('div');
                t.className = 'gallery-thumb' + (i === 0 ? ' is-active' : '');
                t.innerHTML = '<img src="' + src.replace('w=1200', 'w=120') + '" alt="">';
                t.addEventListener('click', () => goTo(i));
                thumbsWrap.appendChild(t);
            });

            function goTo(i) {
                idx = i; img.src = images[idx]; counter.textContent = idx + 1;
                thumbsWrap.querySelectorAll('.gallery-thumb').forEach((t, j) => t.classList.toggle('is-active', j === idx));
            }
            function open() { overlay.classList.add('is-open'); goTo(idx); }
            function close() { overlay.classList.remove('is-open'); }

            document.getElementById('galleryPrev').addEventListener('click', () => goTo((idx - 1 + images.length) % images.length));
            document.getElementById('galleryNext').addEventListener('click', () => goTo((idx + 1) % images.length));
            document.getElementById('galleryClose').addEventListener('click', close);
            overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

            // Wire all gallery buttons
            document.querySelectorAll('[data-open-gallery]').forEach(btn => {
                btn.addEventListener('click', e => { e.preventDefault(); open(); });
            });
            // Keyboard
            document.addEventListener('keydown', e => {
                if (!overlay.classList.contains('is-open')) return;
                if (e.key === 'Escape') close();
                if (e.key === 'ArrowLeft') goTo((idx - 1 + images.length) % images.length);
                if (e.key === 'ArrowRight') goTo((idx + 1) % images.length);
            });
        })();
    </script>

    <script>
        // Robust sync: overlay follows mainImage pixel-perfectly
        (function () {
            var src = document.getElementById('mainImage');
            var ovls = ['imgEvening', 'imgNight'].map(function (id) { return document.getElementById(id); });
            if (!src) return;
            var rafId = null;
            var lastR = {};
            function applyRect() {
                var r = src.getBoundingClientRect();
                ovls.forEach(function (o) {
                    if (!o) return;
                    o.style.top = r.top + window.scrollY + 'px';
                    o.style.left = r.left + window.scrollX + 'px';
                    o.style.width = r.width + 'px';
                    o.style.height = r.height + 'px';
                });
                lastR = r;
            }
            function rafLoop(n) {
                applyRect();
                if (n > 0) requestAnimationFrame(function () { rafLoop(n - 1); });
            }
            function sync() { rafLoop(10); }
            src.addEventListener('load', sync);
            window.addEventListener('load', sync);
            window.addEventListener('resize', sync);
            window.addEventListener('scroll', applyRect);
            window.addEventListener('orientationchange', function () { setTimeout(sync, 250); });
            if ('ResizeObserver' in window) new ResizeObserver(sync).observe(src);
            // Start immediately
            rafLoop(30);
        })();
    </script>

    <div class="day-slider-wrap">

    <script>
        (function () {
            var slider = document.getElementById('daySlider');
            var morning = document.getElementById('mainImage');
            var evening = document.getElementById('imgEvening');
            var night = document.getElementById('imgNight');
            if (!slider || !morning || !evening || !night) return;
            // Morning is the base (always underneath), Evening and Night overlay on top
            morning.style.opacity = 1;
            function updateImages(v) {
                if (v <= 50) {
                    var t = v / 50;
                    evening.style.opacity = t;
                    night.style.opacity = 0;
                } else {
                    var t = (v - 50) / 50;
                    evening.style.opacity = 1;
                    night.style.opacity = t;
                }
            }
            slider.addEventListener('input', function (e) { updateImages(+e.target.value); });
            updateImages(0);
        })();
    </script>
